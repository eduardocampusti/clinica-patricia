name: Validar integração
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:release-notes
      - run: npm run test:pacientes
      - run: npm run test:financeiro
      - run: npm run lint
      - run: npm run build
      - run: npm ci --prefix server
      - run: npm run test:unit --prefix server
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_ANON_KEY: synthetic-test-key
      - run: npm run build --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:operacional
