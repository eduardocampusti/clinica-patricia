<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capturas · Caixa da Recepção</title><style>
:root { color-scheme: light dark; --borda-galeria: color-mix(in srgb, CanvasText 20%, Canvas); } body { font: 16px/1.6 system-ui; color: CanvasText; background: Canvas; margin: 24px auto; padding: 0 20px; max-width: 1400px; } h1 { font-size: 28px; } select { padding: 10px; font: inherit; } main { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 24px; margin-top: 24px; } figure { margin: 0; border: 1px solid var(--borda-galeria); padding: 12px; border-radius: 10px; } img { width: 100%; height: 280px; object-fit: contain; object-position: top; } a { color: LinkText; } figcaption { margin-top: 8px; }
</style></head><body><h1>Caixa da Recepção · capturas sintéticas</h1><p>41 capturas locais. Clique em uma imagem para conferir em tamanho completo. Nenhuma operação financeira real.</p><p><a href="/tests/financeiro/recepcao-preview.html">Abrir prévia interativa</a></p><label for="tamanho">Tamanho: </label><select id="tamanho"><option value="desktop">Computador</option><option value="tablet">Tablet</option><option value="mobile">Celular</option></select><main id="capturas"></main><script>
const basicos = ['aberto','abertura','receber','fechamento','escuro'];
const adicionais = ['estornos','estorno-revisao','fiscal','sangria','suprimento','recibo-falha-impressao','erro','carregando','vazio','permissao','legado'];
const legendas = { aberto:'Caixa aberto', abertura:'Fundo inicial', receber:'Recebimento dividido', fechamento:'Revisão do fechamento', escuro:'Tema escuro', estornos:'Solicitações de estorno', 'estorno-revisao':'Revisão de estorno', fiscal:'Fiscal indisponível', sangria:'Sangria: projeção', suprimento:'Suprimento: projeção', 'recibo-falha-impressao':'Recibo: falha de impressão', erro:'Erro de leitura', carregando:'Carregando', vazio:'Sem movimentações', permissao:'Sem permissão', legado:'Caixa legado' };
function exibir() { const tipo = document.getElementById('tamanho').value; const nomes = (tipo === 'tablet' ? basicos : basicos.concat(adicionais)).map(n => [tipo+'-'+n, legendas[n]]); if (tipo === 'mobile') for (const largura of [360,430]) nomes.push(['mobile-'+largura+'-brotas-proposta','Brotas '+largura+'px · proposta'], ['mobile-'+largura+'-fiscal','Fiscal '+largura+'px']); const raiz = document.getElementById('capturas'); raiz.replaceChildren(); for (const [nome, legenda] of nomes) { const figura=document.createElement('figure'), link=document.createElement('a'), imagem=document.createElement('img'), texto=document.createElement('figcaption'); link.href='/scratch/caixa-recepcao/'+nome+'.png'; link.target='_blank'; link.rel='noopener'; imagem.src=link.href; imagem.alt=legenda; imagem.loading='lazy'; texto.textContent=legenda; link.append(imagem); figura.append(link,texto); raiz.append(figura); } }
document.getElementById('tamanho').addEventListener('change',exibir); exibir();
</script></body></html>
